[package]
name = "spartan2"
version = "0.7.0"
authors = ["Srinath Setty <srinath@microsoft.com>"]
edition = "2024"
description = "High-speed zkSNARKs without trusted setup"
documentation = "https://docs.rs/spartan2"
readme = "README.md"
repository = "https://github.com/Microsoft/Spartan2"
license-file = "LICENSE"
keywords = ["zkSNARKs", "cryptography", "proofs"]

[dependencies]
bellpepper-core = "0.4.0"
bellpepper = "0.4.0"
bellpepper-keccak = { git = "https://github.com/lurk-lab/bellpepper-gadgets", branch = "main" }
bellpepper-uint64 = { git = "https://github.com/lurk-lab/bellpepper-gadgets", branch = "main" }
ff = { version = "0.13.0", features = ["derive"] }
digest = "0.10"
sha3 = "0.10"
sha2 = "0.10"
rayon = "1.10.0"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
itertools = "0.14.0"
subtle = "2.5"
generic-array = "0.14"
num-bigint = { version = "0.4", features = ["serde", "rand"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"
bitvec = "1.0"
byteorder = "1.4.3"
thiserror = "2.0.12"
halo2curves = { version = "0.9.0", features = ["derive_serde", "std"] }
group = "0.13.0"
once_cell = "1.18.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "time"] }
tikv-jemallocator = { version = "0.6.0", optional = true }
clap = { version = "4", features = ["derive"] }

# ============================================================================
# Arkworks Dependencies (for RS Shuffle Gadget)
# Using stable 0.5.x crates.io versions with vanilla R1CS
# ============================================================================

# Core algebra crates
ark-ff = { version = "0.5", default-features = false, features = ["std", "asm"] }
ark-ec = { version = "0.5", default-features = false, features = ["std"] }
ark-serialize = { version = "0.5", default-features = false, features = ["std", "derive"] }
ark-std = { version = "0.5", default-features = false, features = ["std"] }

# SNARK/R1CS libraries (vanilla R1CS)
ark-snark = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false, features = ["std"] }
ark-relations = { version = "0.5", default-features = false, features = ["std"] }
ark-r1cs-std = { version = "0.5", default-features = false, features = ["std"] }

# Crypto primitives (Poseidon sponge with R1CS constraints)
ark-crypto-primitives = { version = "0.5", default-features = false, features = ["std", "sponge", "r1cs"] }

# Curve implementations
ark-bn254 = { version = "0.5", default-features = false, features = ["std", "curve"] }
ark-grumpkin = { version = "0.5", default-features = false, features = ["std"] }

[target.wasm32-unknown-unknown.dependencies]
# see https://github.com/rust-random/rand/pull/948
getrandom = { version = "0.2.0", default-features = false, features = ["js"] }

[dev-dependencies]
rand = "0.8.4"
hex = "0.4.3"
cfg-if = "1.0.0"
sha2 = "0.10.7"
proptest = "1.2.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sha256"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29.0", optional = true }
objc = { version = "0.2.7", optional = true }

[features]
default = []
jem = ["tikv-jemallocator"]
gpu = ["metal", "objc"]

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

[target.'cfg(target_arch = "x86_64")'.dependencies]
halo2curves = { version = "0.9.0", features = ["derive_serde", "std", "asm"] }
